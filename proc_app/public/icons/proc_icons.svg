<!--
Instructions (matching frappe/frappe/public/icons/timeless/icons.svg's own convention):
1. Use viewport 24 24.
2. Do not set stroke or fill colour on structural paths: the wrapping ".icon"
   CSS class (frappe/public/scss/common/icons.scss) applies fill, stroke, and
   stroke-width via CSS custom properties at the point of use; CSS always
   overrides an SVG presentation attribute, so a hardcoded colour here would
   be silently ignored. Confirmed live before drawing anything.
3. A "solid dot" element (the wheels here) is the one exception: set the
   fill to the icon stroke colour variable explicitly, matching frappe's own
   timeless sprite convention for small solid circles, so it renders as a
   filled dot in whatever colour context applies rather than an empty ring.
-->

<svg id="proc-app-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<symbol viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" id="icon-kcsc-procurement">
		<path d="M3 5L5 9L7.5 19L16.5 19L19 9" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="9" cy="21.5" r="1.3" fill="var(--icon-stroke)"/>
		<circle cx="15" cy="21.5" r="1.3" fill="var(--icon-stroke)"/>
	</symbol>
</svg>
